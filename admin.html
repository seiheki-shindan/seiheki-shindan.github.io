/* Layout: one narrow column like a questionnaire card stack; result reads like a profile sheet; admin view is a plain ledger. */
:root {

button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--axis); outline-offset: 2px; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 720px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  for (const [x, dir] of [[80, -1], [120, 1]]) {
    if (watch) {
      p.push(`<path d="M${x - 11} 112 Q${x} 101 ${x + 11} 112 Q${x} 120 ${x - 11} 112z" fill="${eyeInk}"/>`);
      p.push(`<circle cx="${x + 3 * dir}" cy="111" r="2.2" fill="${A.lightEyes ? INK : "#fff"}"/>`);

const $ = (id) => document.getElementById(id);

function show(view) {
  for (const v of ["intro", "quiz", "result", "admin"]) $("view-" + v).hidden = v !== view;

// ---- Quiz ----
function renderQuestions() {
  const box = $("questions");
  box.textContent = "";
  QUESTIONS.forEach(([, , text], i) => {
    const q = document.createElement("div");
    q.className = "q";
    q.innerHTML = `<div class="q-num">Q${i + 1}</div><div class="q-text"></div>
      <div class="scale"><span class="end">そう<br>思わない</span><div class="dots" role="radiogroup"></div><span class="end r">そう<br>思う</span></div>`;
    q.querySelector(".q-text").textContent = text;
    const dots = q.querySelector(".dots");
    dots.setAttribute("aria-label", text);
    for (let v = 1; v <= 5; v++) {
      const l = document.createElement("label");
      l.className = "dot";
      l.innerHTML = `<input type="radio" name="q${i}" id="q${i}-${v}" value="${v}" aria-label="${["そう思わない","あまりそう思わない","どちらでもない","ややそう思う","そう思う"][v-1]}"><span></span>`;

function updateProgress() {
  const n = answers.filter((a) => a !== null).length;
  $("progress-label").textContent = `${n} / ${QUESTIONS.length} 回答済み`;
  $("progress-bar").style.width = (n / QUESTIONS.length * 100) + "%";
  $("submit").disabled = n < QUESTIONS.length;
  $("remain").textContent = n < QUESTIONS.length ? `あと${QUESTIONS.length - n}問` : "";
}

function score(ans) {
  const out = {};
  for (const ax of AXES) {
    let s = 0, max = 0;
    QUESTIONS.forEach(([k, dir], i) => { if (k === ax.key) { s += (ans[i] - 3) * dir; max += 2; } });
    out[ax.key] = Math.round(50 + (s / max) * 50); // % toward pole a
  }
  const code = AXES.map((ax) => (out[ax.key] >= 50 ? ax.a : ax.b)).join("");
  const fet = {};
  QUESTIONS.forEach(([k], i) => { if (k.startsWith("F:")) fet[k.slice(2)] = ans[i]; });
  return { code, pct: out, fet };
}

    r.querySelector("span").textContent = label;
    r.querySelector(".fill").style.width = (v / 5 * 100) + "%";
    r.querySelector(".n").textContent = v === 5 ? "強" : "中";
    pts.appendChild(r);
  });
  const chips = card.querySelector(".chips");
  keywords.forEach((k) => { const c = document.createElement("span"); c.className = "chip"; c.textContent = k; chips.appendChild(c); });
  const save = card.querySelector(".save");
  if (saveState) { const n = document.createElement("div"); n.className = "notice"; n.textContent = saveState; save.appendChild(n); }
  card.querySelector("#retake").addEventListener("click", () => {
    answers.fill(null); renderQuestions(); updateProgress(); show("quiz");
  });
  el.appendChild(card);
  show("result");
}

const ENDPOINT = "https://script.google.com/macros/s/AKfycbxDT_wODMlCMfeeSewbTCrMFNmwd_SEldBCe7QYkJ_nHijH7PWSKaDlsEy2hdij8Lo9/exec";
// ---- Admin ----
async function loadAdmin(key) {
  const el = $("view-admin");
  el.innerHTML = `<div class="card"><p class="muted">結果を読み込んでいます…</p></div>`;
  try {
    const r = await fetch(ENDPOINT + "?key=" + encodeURIComponent(key));
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    renderAdmin(data.rows.reverse());
  } catch (e) {
    el.innerHTML = `<div class="card"><p>結果を読み込めませんでした。管理者キーと、admin.html に書いたURLが正しいか確認してください。</p></div>`;
  }
}
function renderAdmin(rows) {
  const el = $("view-admin");
  el.textContent = "";
  const total = rows.length;
  const counts = {};
  for (const c of Object.keys(TYPES)) counts[c] = 0;
  rows.forEach((r) => { if (counts[r.code] !== undefined) counts[r.code]++; });
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  const avg = {};
  AXES.forEach((ax) => { avg[ax.key] = total ? Math.round(rows.reduce((s, r) => s + (r.pct?.[ax.key] ?? 50), 0) / total) : null; });

  const summary = document.createElement("div");
  summary.className = "card";
  summary.innerHTML = `<h2>結果一覧</h2><div class="stats"></div><p class="muted">回答は匿名で、1人につき最新の1件を集計しています。名前や回答日時は表示しません。</p>`;
  const stats = summary.querySelector(".stats");
  const addStat = (label, value) => { const s = document.createElement("div"); s.className = "stat"; s.innerHTML = `<span class="muted"></span><b></b>`; s.querySelector("span").textContent = label; s.querySelector("b").textContent = value; stats.appendChild(s); };
  addStat("回答者数", total + "人");
  addStat("いちばん多いタイプ", total && top[1] ? `${top[0]}(${top[1]}人)` : "—");
  AXES.forEach((ax) => addStat(`平均:${ax.label}`, avg[ax.key] === null ? "—" : (avg[ax.key] >= 50 ? `${ax.a} ${avg[ax.key]}%` : `${ax.b} ${100 - avg[ax.key]}%`)));
  el.appendChild(summary);

  if (!total) {
    const empty = document.createElement("div");
    empty.className = "card";
    empty.innerHTML = `<p>まだ回答はありません。誰かが診断を終えると、ここにタイプの分布と一人ずつの結果が表示されます。</p>`;
    el.appendChild(empty);
    return;
  }

  const distCard = document.createElement("div");
  distCard.className = "card";
  distCard.innerHTML = `<h3 style="font-size:17px">タイプの分布</h3><div class="dist"></div>`;
  const dist = distCard.querySelector(".dist");
  const maxN = Math.max(1, ...Object.values(counts));
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([code, n]) => {
    const r = document.createElement("div");
    r.className = "dist-row";
    r.innerHTML = `<span></span><div class="track"><div class="fill"></div></div><span class="n"></span>`;
    const who = r.querySelector("span");
    who.className = "who";
    who.innerHTML = mascotSVG(code, 28);
    who.append(`${code} ${TYPES[code][0]}`);
    r.querySelector(".fill").style.width = (n / maxN * 100) + "%";
    r.querySelector(".n").textContent = n;
    dist.appendChild(r);
  });
  el.appendChild(distCard);

  const fetCard = document.createElement("div");
  fetCard.className = "card";
  fetCard.innerHTML = `<h3 style="font-size:17px">刺さりポイントの平均(5段階)</h3><div class="dist"></div>`;
  const fd = fetCard.querySelector(".dist");
  FETISHES.map(([id, label]) => {
    const vals = rows.map((r) => r.fet?.[id]).filter((v) => typeof v === "number");
    return [label, vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null];
  }).sort((a, b) => (b[1] ?? 0) - (a[1] ?? 0)).forEach(([label, v]) => {
    const r = document.createElement("div");
    r.className = "dist-row";
    r.innerHTML = `<span></span><div class="track"><div class="fill"></div></div><span class="n"></span>`;
    r.querySelector("span").textContent = label;
    r.querySelector(".fill").style.width = (v === null ? 0 : (v - 1) / 4 * 100) + "%";
    r.querySelector(".n").textContent = v === null ? "—" : v.toFixed(1);
    fd.appendChild(r);
  });
  el.appendChild(fetCard);

  const listCard = document.createElement("div");
  listCard.className = "card";
  listCard.innerHTML = `<h3 style="font-size:17px">回答ごとの結果(匿名)</h3><div class="table-wrap"><table><thead><tr><th>No.</th><th>タイプ</th>${AXES.map((a) => `<th>${a.a}/${a.b}</th>`).join("")}<th>刺さりポイント上位</th></tr></thead><tbody></tbody></table></div><p class="muted">各軸の数値は左側(L・W・P・T)寄りの度合いです。50%より上なら左側、下なら右側のタイプになります。</p>`;
  const tb = listCard.querySelector("tbody");
  rows.forEach((r, i) => {
    const tr = document.createElement("tr");
    const cells = [String(i + 1), `${r.code} ${TYPES[r.code]?.[0] ?? ""}`, ...AXES.map((a) => (r.pct?.[a.key] ?? "—") + "%"),
      FETISHES.filter(([id]) => (r.fet?.[id] ?? 0) >= 4).sort((a, b) => r.fet[b[0]] - r.fet[a[0]]).slice(0, 3).map((x) => x[1]).join("、") || "—"];
    cells.forEach((c) => { const td = document.createElement("td"); td.textContent = c; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  el.appendChild(listCard);
}

$("login").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!ENDPOINT) { $("view-admin").innerHTML = `<div class="card"><p>admin.html の ENDPOINT にURLを設定してください。</p></div>`; return; }
  loadAdmin($("key").value);
});
</script>
